<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="./styles/reset.css">
  <link rel="stylesheet" href="styles/main.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Time tracking dashboard</title>

</head>

<body>

  <main>
    <article class="report">
      <div class="info">
        <div class="image">
          <img src="./images/image-jeremy.png" alt="">
        </div>
        <div class="content">
          <p>Report for</p>
          <h1>Jeremy Robson</h1>
        </div>
      </div>
      <div class="filters">
        <button aria-pressed="false">Daily</button>
        <button aria-pressed="true">Weekly</button>
        <button aria-pressed="false">Monthly</button>
      </div>
    </article>

    <div class="stats">

      <article class="work">
        <div class="content">
          <div class="header">
            <h2>Work</h2>
            <div class="image">
              <img src="./images/icon-ellipsis.svg" alt="">
            </div>
          </div>
          <div class="stat">
            <p>32hrs</p>
            <p>Last Week - 36hrs</p>
          </div>
        </div>
      </article>

      <article class="play">
        <div class="content">
          <div class="header">
            <h2>Play</h2>
            <div class="image">
              <img src="./images/icon-ellipsis.svg" alt="">
            </div>
          </div>
          <div class="stat">
            <p>32hrs</p>
            <p>Last Week - 36hrs</p>
          </div>
        </div>
      </article>

      <article class="study">
        <div class="content">
          <div class="header">
            <h2>Study</h2>
            <div class="image">
              <img src="./images/icon-ellipsis.svg" alt="">
            </div>
          </div>
          <div class="stat">
            <p>32hrs</p>
            <p>Last Week - 36hrs</p>
          </div>
        </div>
      </article>

      <article class="exercise">
        <div class="content">
          <div class="header">
            <h2>Exercise</h2>
            <div class="image">
              <img src="./images/icon-ellipsis.svg" alt="">
            </div>
          </div>
          <div class="stat">
            <p>32hrs</p>
            <p>Last Week - 36hrs</p>
          </div>
        </div>
      </article>

      <article class="social">
        <div class="content">
          <div class="header">
            <h2>Social</h2>
            <div class="image">
              <img src="./images/icon-ellipsis.svg" alt="">
            </div>
          </div>
          <div class="stat">
            <p>32hrs</p>
            <p>Last Week - 36hrs</p>
          </div>
        </div>
      </article>

      <article class="self-care">
        <div class="content">
          <div class="header">
            <h2>Self Care</h2>
            <div class="image">
              <img src="./images/icon-ellipsis.svg" alt="">
            </div>
          </div>
          <div class="stat">
            <p>32hrs</p>
            <p>Last Week - 36hrs</p>
          </div>
        </div>
      </article>

    </div>

  </main>

</body>

</html>
